<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>محامينا | Mohamena</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #F7FBFA;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 20px 16px;
      background: #F7FBFA;
      color: #26352c;
      font-family: Arial, sans-serif;
      text-align: center;
      line-height: 1.8;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    nav {
      text-align: end;
      margin-bottom: 24px;
    }

    a {
      color: #047E3E;
      font-size: 16px;
    }

    h1 {
      margin: 0 0 16px;
      color: #047E3E;
      font-size: clamp(22px, 6vw, 28px);
      line-height: 1.5;
    }

    p {
      margin: 0 0 16px;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    #load-error {
      color: #a32626;
    }

    /* إطار الدردشة يملأ المساحة داخل Web View */
    .mohamena-chat-full {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100vh !important;
      height: 100dvh !important;
      margin: 0 !important;
    }

    iframe[id^="drdshWidgetFrame"] {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      border: 0 !important;
      display: block !important;
    }
  </style>
</head>

<body>
  <main>
    <nav>
      <a id="language-switch" href="?lang=en">English</a>
    </nav>

    <h1 id="heading">مرحبًا بك في محامينا</h1>

    <p id="description">
      جارٍ تحميل المحادثة…
    </p>

    <p id="load-error" role="alert" hidden>
      تعذّر تحميل المحادثة. يرجى تحديث الصفحة والمحاولة مجددًا.
    </p>
  </main>

  <script>
    var language =
      new URLSearchParams(window.location.search).get("lang") === "en"
        ? "en"
        : "ar";

    document.documentElement.lang = language;
    document.documentElement.dir =
      language === "ar" ? "rtl" : "ltr";

    if (language === "en") {
      document.getElementById("heading").textContent =
        "Welcome to Mohamena";

      document.getElementById("description").textContent =
        "Loading chat…";

      document.getElementById("load-error").textContent =
        "Unable to load the chat. Please refresh the page and try again.";

      document.getElementById("language-switch").textContent =
        "العربية";

      document.getElementById("language-switch").href =
        "?lang=ar";
    }

    /* إعدادات دردش */
    window.__dc = window.__dc || {};
    window.__dc.acid = 607629336;
    window.__dc._v = "2.0";
    window.__dc.locale = language;
    window.__dc.screen = "full";
    window.__dc.autoOpen = true;

    /* تنسيق المحتوى داخل إطار دردش */
    function adjustMohamenaChat() {
      document
        .querySelectorAll('iframe[id^="drdshWidgetFrame"]')
        .forEach(function (frame) {
          if (frame.parentElement) {
            frame.parentElement.classList.add(
              "mohamena-chat-full"
            );
          }

          try {
            var doc = frame.contentDocument;

            if (
              !doc ||
              !doc.head ||
              doc.getElementById("mohamena-chat-style")
            ) {
              return;
            }

            var style = doc.createElement("style");
            style.id = "mohamena-chat-style";

            style.textContent = `
              html, body {
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-sizing: border-box;
              }

              #drdshStartChatBox {
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                min-height: 0 !important;
                max-height: none !important;
                border-radius: 0 !important;
              }

              button {
                box-sizing: border-box !important;
                max-width: 100% !important;
                white-space: normal !important;
                overflow-wrap: anywhere !important;
                height: auto !important;
                line-height: 1.6 !important;
              }

              .chatItem {
                max-width: 100% !important;
                overflow-wrap: anywhere !important;
              }
            `;

            doc.head.appendChild(style);
          } catch (error) {
            console.warn(
              "Unable to adjust chat frame:",
              error
            );
          }
        });
    }

    /* مراقبة إضافة إطار الدردشة وتحميله */
    function watchMohamenaChat() {
      document
        .querySelectorAll('iframe[id^="drdshWidgetFrame"]')
        .forEach(function (frame) {
          if (!frame.dataset.mohamenaWatched) {
            frame.dataset.mohamenaWatched = "true";
            frame.addEventListener(
              "load",
              adjustMohamenaChat
            );
          }
        });

      adjustMohamenaChat();
    }

    new MutationObserver(watchMohamenaChat).observe(
      document.body,
      { childList: true, subtree: true }
    );

    window.addEventListener("load", watchMohamenaChat);
    watchMohamenaChat();

    /* تحميل سكربت دردش */
    (function () {
      var script = document.createElement("script");
      script.type = "text/javascript";
      script.async = true;
      script.src =
        "https://www.drdsh.live/dc_tracking.js?t=" +
        Date.now();

      script.onerror = function () {
        document.getElementById("description").hidden = true;
        document.getElementById("load-error").hidden = false;
      };

      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
